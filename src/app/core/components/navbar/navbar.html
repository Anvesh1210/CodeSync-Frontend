<nav *ngIf="isVisible" class="h-16 flex items-center justify-between px-8 bg-background border-b border-slate-800/50 backdrop-blur-md sticky top-0 z-[100]">
  <div class="flex items-center space-x-10">
    <!-- Logo -->
    <a routerLink="/" class="flex items-center space-x-3 group">
      <div class="w-8 h-8 bg-primary rounded shadow-[0_0_15px_rgba(var(--bg-primary-rgb),0.5)] group-hover:shadow-[0_0_25px_rgba(var(--bg-primary-rgb),0.8)] transition-all flex items-center justify-center text-black font-bold text-lg">C</div>
      <span class="text-xl font-bold tracking-[0.2em] text-white">CODESYNC</span>
    </a>

    <!-- Links -->
    <div class="hidden md:flex items-center space-x-6 text-xs font-bold uppercase tracking-widest">
      <a routerLink="/projects/discover" 
         routerLinkActive="active-nav-item" 
         class="px-4 py-2 rounded-lg text-slate-500 hover:text-primary transition-all flex items-center border border-transparent">
        <span class="opacity-40 mr-2">//</span> discover
      </a>
      <a routerLink="/pricing" 
         routerLinkActive="active-nav-item" 
         class="px-4 py-2 rounded-lg text-slate-500 hover:text-primary transition-all flex items-center border border-transparent">
        <span class="opacity-40 mr-2">//</span> pricing
      </a>
      <a *ngIf="isAuthenticated" 
         routerLink="/dashboard" 
         routerLinkActive="active-nav-item" 
         class="px-4 py-2 rounded-lg text-slate-500 flex items-center hover:text-primary transition-all border border-transparent">
        <span class="opacity-40 mr-2">//</span> dashboard
      </a>
    </div>
  </div>

  <div class="flex items-center space-x-4">
    <!-- Theme Toggle -->
    <button (click)="themeService.toggleTheme()" class="p-2 text-slate-400 hover:text-white transition-colors" [title]="themeService.isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
      <svg *ngIf="themeService.isDarkMode()" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M16.95 16.95l.707.707M7.757 7.757l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path></svg>
      <svg *ngIf="!themeService.isDarkMode()" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
    </button>

    <ng-container *ngIf="!isAuthenticated">
      <a routerLink="/auth/login" class="text-xs font-bold uppercase tracking-widest text-white hover:text-primary transition-colors">Sign in</a>
      <a routerLink="/auth/register" class="bg-primary text-black px-5 py-2 text-xs font-bold uppercase tracking-widest rounded hover:opacity-90 transition-all">Initialize</a>
    </ng-container>

    <ng-container *ngIf="isAuthenticated">
      <!-- Notifications -->
      <app-notifications-dropdown></app-notifications-dropdown>

      <!-- User Profile -->
      <div class="group relative">
        <div *ngIf="!userAvatarUrl || imageError" [class.border-yellow-500]="isPremium" class="w-9 h-9 rounded-full border border-slate-700 bg-surface flex items-center justify-center text-primary font-mono text-sm font-bold cursor-pointer hover:border-primary transition-colors">
          {{ userInitials }}
        </div>
        <img *ngIf="userAvatarUrl && !imageError" [src]="userAvatarUrl" (error)="imageError = true" referrerpolicy="no-referrer" [class.border-yellow-500]="isPremium" class="w-9 h-9 rounded-full border border-slate-700 object-cover cursor-pointer hover:border-primary transition-colors">
        
        <!-- Profile Dropdown (Keep existing functionality) -->
        <div class="absolute right-0 mt-2 w-56 bg-surface border border-slate-800 rounded-xl shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50 overflow-hidden">
          <div class="px-4 py-3 border-b border-slate-800 bg-black/20">
            <div class="flex items-center justify-between">
              <p class="text-sm font-bold text-white">{{ userName }}</p>
              <span *ngIf="isPremium" class="bg-yellow-500 text-black text-[9px] font-bold px-1.5 py-0.5 rounded uppercase">PRO</span>
            </div>
            <p class="text-[10px] font-mono text-slate-500">{{ userEmail }}</p>
          </div>
          <div class="py-2">
            <a routerLink="/dashboard" class="flex items-center px-4 py-2 text-xs font-bold uppercase tracking-widest text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">
              Dashboard
            </a>
            <a routerLink="/profile" class="flex items-center px-4 py-2 text-xs font-bold uppercase tracking-widest text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">
              Profile
            </a>
            <div class="border-t border-slate-800 my-1"></div>
            <button (click)="logout()" class="w-full flex items-center px-4 py-2 text-xs font-bold uppercase tracking-widest text-red-400 hover:bg-slate-800 transition-colors">
              Sign out
            </button>
          </div>
        </div>
      </div>
    </ng-container>
  </div>
</nav>
