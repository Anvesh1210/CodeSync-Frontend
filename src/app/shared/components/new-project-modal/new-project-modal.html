<div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-0">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-background/80 backdrop-blur-sm transition-opacity" (click)="closeModal()"></div>

  <!-- Modal Panel -->
  <div class="relative bg-surface border border-slate-800 rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.5)]">
    
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-background/50">
      <h3 class="text-lg font-bold text-white">Initialize new project</h3>
      <button (click)="closeModal()" class="text-slate-500 hover:text-white transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <div class="p-6 space-y-6">
      
      <div *ngIf="errorMessage" class="bg-red-500/10 border border-red-500/50 text-red-400 text-xs font-mono p-3 rounded">
        {{ errorMessage }}
      </div>

      <div>
        <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Name</label>
        <input type="text" 
          class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-sm"
          [(ngModel)]="projectName" placeholder="my-awesome-project">
      </div>

      <div>
        <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Description</label>
        <textarea rows="3"
          class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-sm resize-none"
          [(ngModel)]="projectDescription" placeholder="What does it do?"></textarea>
      </div>

      <div>
        <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Language</label>
        <div class="relative">
          <select [(ngModel)]="projectLanguage" class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-slate-200 focus:outline-none focus:border-primary transition-colors font-mono text-sm appearance-none">
            <option value="TypeScript">TypeScript</option>
            <option value="Python">Python</option>
            <option value="Java">Java</option>
            <option value="Go">Go</option>
            <option value="Rust">Rust</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between p-4 border border-slate-800 rounded-lg bg-background">
        <div>
          <div class="flex items-center space-x-2">
            <h4 class="text-sm font-bold text-white font-mono">{{ isPublic ? 'Public' : 'Private' }}</h4>
            <span *ngIf="!isPublic && !isPremiumUser" class="bg-yellow-500/10 text-yellow-500 text-[8px] font-bold px-1.5 py-0.5 rounded border border-yellow-500/20 uppercase tracking-tighter">Limit: 3</span>
          </div>
          <p class="text-[10px] text-slate-500 font-mono">{{ isPublic ? 'Anyone can view' : 'Only members can view' }}</p>
        </div>
        <!-- Toggle Switch -->
        <button type="button" (click)="isPublic = !isPublic" 
          [ngClass]="isPublic ? 'bg-primary' : 'bg-slate-700'"
          class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none">
          <span 
            [ngClass]="isPublic ? 'translate-x-5' : 'translate-x-0'"
            class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-black shadow ring-0 transition duration-200 ease-in-out"></span>
        </button>
      </div>

    </div>

    <div class="px-6 py-4 border-t border-slate-800 bg-background/50 flex justify-end space-x-4">
      <button (click)="closeModal()" class="text-sm font-bold text-slate-400 hover:text-white transition-colors font-mono">Cancel</button>
      <button (click)="createProject()" [disabled]="isSubmitting"
        class="bg-primary hover:bg-primary/90 text-black px-6 py-2 rounded font-mono text-sm font-bold transition-all shadow-[0_0_15px_rgba(0,240,255,0.3)] disabled:opacity-50">
        {{ isSubmitting ? 'Creating...' : 'Create' }}
      </button>
    </div>

  </div>
</div>
