<div class="flex-1 overflow-y-auto py-2 text-xs font-mono">
  <ng-container *ngTemplateOutlet="tree; context: { $implicit: files }"></ng-container>

  <ng-template #tree let-nodes>
    <div *ngFor="let node of nodes" class="select-none">
      <div 
        (click)="selectNode(node)"
        class="flex items-center px-4 py-1.5 cursor-pointer transition-all group relative"
        [ngClass]="{
          'bg-primary/10 border-l-2 border-primary': activeFileId === node.fileId,
          'bg-slate-800/20': selectedNodeId === node.fileId && activeFileId !== node.fileId,
          'hover:bg-slate-800/10': selectedNodeId !== node.fileId
        }"
        [style.padding-left.px]="(node.path.split('/').length * 12) + 16">
        
        <!-- Folder Toggle/Icon -->
        <span *ngIf="node.isFolder" (click)="toggleFolder($event, node.fileId)" class="mr-1.5 text-slate-500 hover:text-white">
          <svg class="w-3 h-3 transition-transform" [class.rotate-90]="expandedFolders.has(node.fileId)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </span>

        <svg *ngIf="node.isFolder" class="w-4 h-4 mr-2 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>
        <svg *ngIf="!node.isFolder" class="w-4 h-4 mr-2 text-slate-400 group-hover:text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>

        <span *ngIf="renamingId !== node.fileId" class="truncate" [ngClass]="activeFileId === node.fileId ? 'text-primary' : 'text-slate-300'">{{ node.name }}</span>
        
        <input 
          *ngIf="renamingId === node.fileId"
          #renameInput
          [value]="node.name"
          (keyup.enter)="confirmRename(node.fileId, renameInput.value)"
          (keyup.escape)="cancelRename()"
          (blur)="confirmRename(node.fileId, renameInput.value)"
          class="flex-1 bg-slate-800 border-none text-[11px] font-mono text-white focus:outline-none p-0"
          autofocus
          (click)="$event.stopPropagation()">

        <!-- Actions (hidden by default, show on hover) -->
        <div *ngIf="renamingId !== node.fileId" class="absolute right-2 top-1.5 hidden group-hover:flex items-center space-x-1.5 bg-slate-900/90 pl-2 rounded">
          <button (click)="onRename($event, node.fileId)" title="Rename" class="text-slate-500 hover:text-white p-0.5">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
          </button>
          <button (click)="onDelete($event, node.fileId)" title="Delete" class="text-slate-500 hover:text-red-400 p-0.5">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          </button>
        </div>
      </div>

      <!-- Recursive children -->
      <div *ngIf="node.isFolder && expandedFolders.has(node.fileId)">
        <ng-container *ngTemplateOutlet="tree; context: { $implicit: node.children }"></ng-container>
      </div>
    </div>
  </ng-template>

  <div *ngIf="!files || files.length === 0" class="px-6 py-10 text-slate-600 font-mono text-[10px] text-center uppercase tracking-widest">
    Empty Workspace
  </div>
</div>
