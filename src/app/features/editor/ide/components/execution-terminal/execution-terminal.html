<div class="h-full border-t border-slate-800 bg-surface flex flex-col shrink-0 z-10 w-full">
  <div class="h-9 border-b border-slate-800 flex items-center px-4 pr-20 justify-between bg-slate-800/20">
    <div class="flex items-center space-x-4">
      <div class="flex items-center border border-slate-700 rounded bg-background px-3 py-1.5 text-xs font-mono text-slate-300">
        <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        {{ language || 'STANDARD' | uppercase }}
      </div>
      <button (click)="clearTerminal()" class="text-xs font-mono text-slate-500 hover:text-white flex items-center px-2 transition-colors">
        <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        CLEAR
      </button>
      
      <!-- Filters -->
      <div class="h-4 w-px bg-slate-700 mx-2"></div>
      <select [(ngModel)]="filterLanguage" (change)="applyFilters()" class="bg-transparent border-none text-[10px] font-mono text-slate-400 focus:ring-0">
        <option value="all">ALL LANGUAGES</option>
        <option value="java">JAVA</option>
        <option value="python">PYTHON</option>
        <option value="go">GO</option>
        <option value="rust">RUST</option>
      </select>
      <select [(ngModel)]="filterStatus" (change)="applyFilters()" class="bg-transparent border-none text-[10px] font-mono text-slate-400 focus:ring-0">
        <option value="all">ALL STATUS</option>
        <option value="COMPLETED">COMPLETED</option>
        <option value="FAILED">FAILED</option>
        <option value="TIME_OUT">TIMEOUT</option>
      </select>
    </div>
    <div class="flex items-center text-[10px] font-mono tracking-widest uppercase"
         [ngClass]="{
           'text-slate-500': status === 'IDLE',
           'text-yellow-400': status === 'QUEUED' || status === 'RUNNING',
           'text-emerald-400': status === 'COMPLETED',
           'text-red-400': status === 'FAILED' || status === 'TIME_OUT'
         }">
      <span class="w-1.5 h-1.5 rounded-full mr-1.5"
            [ngClass]="{
              'bg-slate-500': status === 'IDLE',
              'bg-yellow-400 animate-pulse': status === 'QUEUED' || status === 'RUNNING',
              'bg-emerald-400': status === 'COMPLETED',
              'bg-red-400': status === 'FAILED' || status === 'TIME_OUT'
            }"></span>
      {{ status }}
      <span *ngIf="isPremiumUser" class="ml-2 bg-yellow-500 text-black text-[8px] font-bold px-1.5 py-0.5 rounded flex items-center">
        <svg class="w-2 h-2 mr-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
        PRO
      </span>
    </div>
  </div>
  <div class="flex-1 flex bg-background p-4 relative overflow-hidden">
    <div class="flex flex-col w-1/3 border-r border-slate-800 pr-4">
      <div class="text-[10px] font-mono text-slate-500 uppercase tracking-widest mb-2">STDIN</div>
      <textarea [(ngModel)]="stdin" class="flex-1 bg-transparent border border-slate-800 rounded p-2 text-slate-300 font-mono text-xs resize-none focus:outline-none focus:border-slate-600 transition-colors" placeholder="custom input..."></textarea>
    </div>
    
    <div class="flex flex-col flex-1 pl-4 overflow-hidden">
      <div class="text-[10px] font-mono text-slate-500 uppercase tracking-widest mb-2">STDOUT / STDERR</div>
      <div class="flex-1 overflow-y-auto font-mono text-xs whitespace-pre-wrap">
        <span *ngIf="stdout" class="text-slate-300">{{ stdout }}</span>
        <span *ngIf="stderr" class="text-red-400">{{ stderr }}</span>
        <span *ngIf="!stdout && !stderr && status !== 'IDLE'" class="text-slate-600 italic">No output</span>
        <span *ngIf="status === 'IDLE' && !stdout && !stderr" class="text-slate-600">// CodeSync Sandbox Ready. Run code to see output.</span>
      </div>
    </div>

    <!-- History Panel (Mini) -->
    <div *ngIf="history.length > 0" class="w-48 border-l border-slate-800 pl-4 overflow-y-auto hidden md:block">
      <div class="text-[10px] font-mono text-slate-500 uppercase tracking-widest mb-2">HISTORY</div>
      <div *ngFor="let job of filteredHistory" class="mb-2 p-1.5 border border-slate-800 rounded hover:bg-slate-800/40 cursor-pointer transition-colors group">
        <div class="flex justify-between items-center mb-1">
          <span class="text-[9px] font-bold text-slate-400 uppercase">{{ job.language }}</span>
          <span class="w-1.5 h-1.5 rounded-full" [ngClass]="{'bg-emerald-500': job.status === 'COMPLETED', 'bg-red-500': job.status !== 'COMPLETED'}"></span>
        </div>
        <div class="text-[8px] text-slate-600 truncate">{{ job.submittedAt | date:'shortTime' }}</div>
      </div>
    </div>
  </div>
</div>
