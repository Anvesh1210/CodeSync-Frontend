<div class="flex-1 overflow-y-auto p-4 space-y-6">

  <!-- Error Message -->
  <div *ngIf="error" class="bg-red-900/30 border border-red-700 text-red-300 text-xs font-mono p-3 rounded-lg flex items-center justify-between">
    <span>{{ error }}</span>
    <button (click)="error = null" class="text-red-400 hover:text-red-200">✕</button>
  </div>

  <!-- Create Snapshot -->
  <div>
    <div class="text-[10px] font-mono tracking-widest text-slate-500 uppercase mb-2">Create Snapshot</div>
    <div class="border border-slate-700 bg-background rounded-lg p-2">
      <textarea [(ngModel)]="commitMessage"
        class="w-full bg-transparent border-none text-slate-300 font-mono text-xs resize-none focus:outline-none mb-2"
        rows="2"
        placeholder="Commit message..."></textarea>
      <div class="flex justify-end">
        <button (click)="commit()"
          [disabled]="!commitMessage.trim() || isCommitting"
          class="bg-emerald-500 hover:bg-emerald-400 disabled:opacity-50 text-black text-[10px] font-mono tracking-widest px-3 py-1.5 rounded transition-colors uppercase font-bold flex items-center gap-1">
          <span *ngIf="isCommitting">Saving...</span>
          <span *ngIf="!isCommitting">Commit</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Diff Viewer -->
  <div *ngIf="diffResult" class="border border-slate-700 bg-background rounded-lg p-3">
    <div class="flex items-center justify-between mb-2">
      <span class="text-[10px] font-mono text-slate-400 uppercase tracking-widest">{{ diffTitle }}</span>
      <button (click)="closeDiff()" class="text-slate-500 hover:text-slate-300 text-xs">✕ Close</button>
    </div>
    <div class="overflow-auto max-h-48 text-xs font-mono">
      <div *ngFor="let line of diffResult"
        [class.text-emerald-400]="line.startsWith('+')"
        [class.text-red-400]="line.startsWith('-')"
        [class.text-slate-500]="line.startsWith(' ')"
        class="whitespace-pre leading-5">{{ line }}</div>
    </div>
  </div>

  <!-- History -->
  <div>
    <div class="text-[10px] font-mono tracking-widest text-slate-500 uppercase mb-3">History</div>

    <!-- Loading -->
    <div *ngIf="isLoading" class="text-xs font-mono text-slate-500 text-center py-4">Loading history...</div>

    <!-- Empty State -->
    <div *ngIf="!isLoading && snapshots.length === 0 && !error"
      class="text-xs font-mono text-slate-600 text-center py-6 border border-dashed border-slate-800 rounded-lg">
      No snapshots yet. Make your first commit!
    </div>

    <div class="space-y-3 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-slate-800 before:to-transparent">
      <div *ngFor="let snap of snapshots; let i = index"
        class="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">

        <div class="flex items-center justify-center w-6 h-6 rounded-full border border-slate-700 bg-surface shrink-0 z-10 group-hover:border-emerald-500 transition-colors">
          <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full" *ngIf="i === 0"></div>
          <div class="w-1.5 h-1.5 bg-slate-600 rounded-full" *ngIf="i !== 0"></div>
        </div>

        <div class="w-[calc(100%-2rem)] ml-3 bg-surface border border-slate-800 rounded-lg p-3 group-hover:border-slate-600 transition-colors">
          <div class="flex items-center justify-between mb-1">
            <span class="text-xs font-bold text-white">{{ snap.message }}</span>
            <span class="text-[10px] font-mono text-slate-500">{{ formatTime(snap.createdAt) }}</span>
          </div>
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-1.5">
              <div class="w-4 h-4 rounded-full bg-primary/20 text-primary flex items-center justify-center text-[8px] font-bold font-mono">
                {{ snap.authorId ? snap.authorId.substring(0,2).toUpperCase() : 'U' }}
              </div>
              <span class="text-[10px] font-mono text-slate-400">{{ snap.branch || 'main' }}</span>
              <span *ngIf="snap.tag" class="text-[9px] font-mono text-amber-400 border border-amber-700 px-1 rounded">{{ snap.tag }}</span>
            </div>
            <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
              <button (click)="viewDiff(snap, i)"
                *ngIf="i < snapshots.length - 1"
                class="text-[10px] font-mono text-blue-400 hover:text-blue-300 uppercase tracking-widest">Diff</button>
              <button (click)="restore(snap)"
                class="text-[10px] font-mono text-emerald-500 hover:text-emerald-400 uppercase tracking-widest">Restore</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
