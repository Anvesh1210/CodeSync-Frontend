<div class="min-h-full bg-background flex flex-col font-sans pb-32">
  
  <!-- Profile Nav Tabs -->
  <div class="border-b border-slate-800 px-8 pt-6">
    <div class="flex space-x-8 text-xs font-mono font-bold tracking-widest uppercase">
      <a href="#" class="text-slate-500 hover:text-slate-300 pb-4 transition-colors">Overview</a>
      <a href="#" class="text-primary border-b-2 border-primary pb-4">Profile</a>
      <a routerLink="/pricing" class="text-slate-500 hover:text-slate-300 pb-4 transition-colors">Billing</a>
    </div>
  </div>

  <div class="px-8 max-w-[1200px] w-full mt-10">
    
    <!-- Header -->
    <div class="mb-10">
      <h1 class="text-3xl font-bold text-white tracking-tight mb-2">Profile settings</h1>
      <div class="text-slate-500 text-[10px] font-mono tracking-widest uppercase">// configure your node identity</div>
    </div>

    <!-- Message Display -->
    <div *ngIf="message" 
      [class]="'mb-6 p-4 rounded font-mono text-xs ' + (isError ? 'bg-red-900/30 text-red-400 border border-red-800' : 'bg-green-900/30 text-green-400 border border-green-800')">
      {{ message }}
    </div>

    <div class="space-y-6" *ngIf="user">
      
      <!-- Profile settings Card -->
      <div class="bg-surface border border-slate-800 rounded-xl p-8">
        
        <!-- Avatar Section -->
        <div class="flex items-center space-x-6 mb-8">
          <div *ngIf="!user.avatarUrl || imageError" class="w-24 h-24 rounded-full border border-primary bg-background flex items-center justify-center text-primary font-mono text-2xl">
            {{ userInitials }}
          </div>
          <img *ngIf="user.avatarUrl && !imageError" [src]="user.avatarUrl" (error)="imageError = true" referrerpolicy="no-referrer" class="w-24 h-24 rounded-full border border-primary object-cover">
          <div>
            <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Avatar URL</label>
            <input type="text" [(ngModel)]="user.avatarUrl" (ngModelChange)="imageError = false"
              class="block w-full px-4 py-2 bg-background border border-slate-800 rounded text-white placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-[10px] w-64"
              placeholder="https://...">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div>
            <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Username</label>
            <input type="text" [(ngModel)]="user.username"
              class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-white placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-sm">
          </div>
          <div>
            <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Full Name</label>
            <input type="text" [(ngModel)]="user.fullName"
              class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-white placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-sm">
          </div>
          <div>
            <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Email</label>
            <input type="text" 
              class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-slate-400 placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-sm"
              [value]="user.email" disabled>
          </div>
          <div>
            <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Plan Type</label>
            <div class="px-4 py-2.5 bg-background border border-slate-800 rounded text-primary font-mono text-sm">
              {{ user.planType || 'FREE' }}
            </div>
          </div>
        </div>

        <div class="mb-8">
          <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Bio</label>
          <textarea rows="4" [(ngModel)]="user.bio"
            class="block w-full px-4 py-3 bg-background border border-slate-800 rounded text-white placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-sm resize-y"
            placeholder="Tell us about yourself..."></textarea>
        </div>

        <div class="flex justify-end">
          <button (click)="saveProfile()" class="bg-primary hover:bg-primary/90 text-black px-6 py-2.5 rounded font-mono text-xs font-bold tracking-widest uppercase transition-all shadow-[0_0_15px_rgba(0,240,255,0.3)]">
            Save changes
          </button>
        </div>

      </div>

      <!-- Change password Card -->
      <div class="bg-surface border border-slate-800 rounded-xl p-8" *ngIf="user.provider === 'LOCAL' || !user.provider">
        <h3 class="text-xl font-bold text-white mb-2">Change password</h3>
        <div class="text-slate-500 text-[10px] font-mono tracking-widest uppercase mb-8">// rotate your access credential</div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
          <div>
            <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Current password</label>
            <input type="password" [(ngModel)]="passwords.currentPassword"
              class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-white placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-sm">
          </div>
          <div>
            <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">New password</label>
            <input type="password" [(ngModel)]="passwords.newPassword"
              class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-white placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-sm">
          </div>
          <div>
            <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Confirm password</label>
            <input type="password" [(ngModel)]="passwords.confirmPassword"
              class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-white placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-sm">
          </div>
        </div>

        <div class="flex justify-end">
          <button (click)="updatePassword()" class="bg-background border border-slate-800 hover:border-slate-600 text-white px-6 py-2.5 rounded text-[10px] font-mono tracking-widest uppercase font-bold transition-colors">
            Update password
          </button>
        </div>
      </div>

    </div>
  </div>

</div>
