<div class="min-h-full bg-background p-8">
  <div class="max-w-2xl mx-auto">
    <a routerLink="/projects/discover" class="text-[10px] font-mono text-slate-500 hover:text-white transition-colors">
      ← back to discover
    </a>

    <div class="mt-6 border border-slate-800 bg-surface rounded-xl p-6">
      <h1 class="text-2xl text-white font-bold mb-2">Create Project</h1>
      <p class="text-slate-400 text-sm font-mono mb-6">Set project basics and create your workspace.</p>

      <div *ngIf="errorMessage" class="mb-5 border border-red-500/50 bg-red-500/10 rounded px-4 py-3 text-red-400 text-sm font-mono">
        {{ errorMessage }}
      </div>

      <form (ngSubmit)="createProject()" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-300 font-mono mb-2">Project Name</label>
          <input
            type="text"
            name="name"
            [(ngModel)]="name"
            required
            maxlength="120"
            placeholder="e.g. realtime-editor"
            class="w-full px-3 py-2 bg-background border border-slate-800 rounded text-slate-200 focus:outline-none focus:border-primary font-mono text-sm" />
        </div>

        <div>
          <label class="block text-xs text-slate-300 font-mono mb-2">Description</label>
          <textarea
            name="description"
            [(ngModel)]="description"
            rows="4"
            maxlength="1000"
            placeholder="Describe what this project does..."
            class="w-full px-3 py-2 bg-background border border-slate-800 rounded text-slate-200 focus:outline-none focus:border-primary font-mono text-sm resize-none"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-slate-300 font-mono mb-2">Language</label>
            <select
              name="language"
              [(ngModel)]="language"
              class="w-full px-3 py-2 bg-background border border-slate-800 rounded text-slate-200 focus:outline-none focus:border-primary font-mono text-sm">
              <option *ngFor="let lang of languages" [value]="lang">{{ lang }}</option>
            </select>
          </div>

          <div>
            <label class="block text-xs text-slate-300 font-mono mb-2">Visibility</label>
            <select
              name="visibility"
              [(ngModel)]="visibility"
              class="w-full px-3 py-2 bg-background border border-slate-800 rounded text-slate-200 focus:outline-none focus:border-primary font-mono text-sm">
              <option value="PUBLIC">Public</option>
              <option value="PRIVATE">Private</option>
            </select>
          </div>
        </div>

        <button
          type="submit"
          [disabled]="isSubmitting"
          class="w-full mt-2 bg-primary hover:bg-primary/90 text-black px-4 py-3 rounded text-xs font-bold uppercase tracking-widest disabled:opacity-50">
          {{ isSubmitting ? 'Creating...' : 'Create Project' }}
        </button>
      </form>
    </div>
  </div>
</div>
