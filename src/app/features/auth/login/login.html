<div class="min-h-full flex items-center justify-center p-8 bg-background relative overflow-hidden text-slate-300">
  <div class="max-w-7xl w-full grid lg:grid-cols-2 gap-16 items-center z-10">
    
    <!-- Left Side: Copy & Demo Credentials -->
    <div class="space-y-10">
      <div>
        <div class="text-primary text-xs font-mono mb-4 tracking-widest uppercase">// authenticate</div>
        <h1 class="text-5xl md:text-6xl font-bold text-white tracking-tight mb-6">
          Sign in to your<br/>
          <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">workspace.</span>
        </h1>
        <p class="text-lg text-slate-400 font-mono leading-relaxed max-w-lg">
          Reconnect to active sessions, resume<br/>
          snapshots, and continue collaborating with<br/>
          your mesh.
        </p>
      </div>
    </div>

    <!-- Right Side: Login Form -->
    <div class="lg:ml-auto w-full max-w-md">
      <div class="bg-surface border border-slate-800 rounded-2xl p-8 shadow-2xl relative">
        <div class="mb-8">
          <h2 class="text-2xl font-bold text-white mb-2">Welcome back</h2>
          <p class="text-slate-500 font-mono text-xs">// enter the mesh</p>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
          <a [href]="oauthBaseUrl + '/github'" class="flex items-center justify-center space-x-2 border border-slate-700 bg-background hover:bg-slate-800 text-white px-4 py-2.5 rounded font-mono text-sm transition-colors cursor-pointer">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path></svg>
            <span>GitHub</span>
          </a>
          <a [href]="oauthBaseUrl + '/google'" class="flex items-center justify-center space-x-2 border border-slate-700 bg-background hover:bg-slate-800 text-white px-4 py-2.5 rounded font-mono text-sm transition-colors cursor-pointer">
            <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            <span>Google</span>
          </a>
        </div>

        <div class="flex items-center mb-6">
          <div class="flex-grow border-t border-slate-800"></div>
          <span class="px-3 text-[10px] text-slate-500 font-mono tracking-widest uppercase">Or with email</span>
          <div class="flex-grow border-t border-slate-800"></div>
        </div>

        <div *ngIf="errorMessage" class="mb-6 p-3 bg-red-500/10 border border-red-500/50 rounded text-red-500 text-sm font-mono text-center">
          {{ errorMessage }}
        </div>

        <form (ngSubmit)="login()" class="space-y-5">
          <div>
            <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Email or Username</label>
            <input type="text" name="email" [(ngModel)]="username" required
              class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-sm"
              placeholder="dev@codesync.local or dev">
          </div>

          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="block text-[10px] font-mono tracking-widest text-slate-400 uppercase">Password</label>
              <a routerLink="/auth/forgot-password" class="text-[10px] font-mono tracking-widest text-primary hover:text-white transition-colors uppercase">Forgot?</a>
            </div>
            <input type="password" name="password" [(ngModel)]="password" required
              class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-sm tracking-widest"
              placeholder="••••••••••">
          </div>

          <button type="submit" [disabled]="isLoading"
            class="w-full py-3 px-4 rounded text-sm font-bold text-black bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-surface focus:ring-primary transition-all uppercase tracking-widest shadow-[0_0_15px_rgba(0,240,255,0.3)] mt-2 disabled:opacity-50 disabled:cursor-not-allowed">
            {{ isLoading ? 'Processing...' : 'Sign In' }}
          </button>
        </form>
        
        <p class="mt-6 text-center text-xs text-slate-400 font-mono">
          New here? 
          <a routerLink="/auth/register" class="font-bold text-primary hover:text-white transition-colors">Create an account</a>
        </p>
      </div>
    </div>
  </div>
</div>
