<div class="min-h-full flex items-center justify-center p-8 bg-background relative overflow-hidden text-slate-300">
  <div class="max-w-7xl w-full grid lg:grid-cols-2 gap-16 items-center z-10">
    
    <!-- Left Side -->
    <div class="space-y-10">
      <div>
        <div class="text-primary text-xs font-mono mb-4 tracking-widest uppercase">// recover access</div>
        <h1 class="text-5xl md:text-6xl font-bold text-white tracking-tight mb-6">
          Reset your<br/>
          <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">password.</span>
        </h1>
        <p class="text-lg text-slate-400 font-mono leading-relaxed max-w-lg">
          Lost your key to the mesh?<br/>
          Verify your identity and get back to<br/>
          building the future.
        </p>
      </div>
    </div>

    <!-- Right Side: Form -->
    <div class="lg:ml-auto w-full max-w-md">
      <div class="bg-surface border border-slate-800 rounded-2xl p-8 shadow-2xl relative">
        <div class="mb-8">
          <h2 class="text-2xl font-bold text-white mb-2">Password Recovery</h2>
          <p class="text-slate-500 font-mono text-xs">// securely reset your credentials</p>
        </div>

        <div *ngIf="errorMessage" class="mb-6 p-3 bg-red-500/10 border border-red-500/50 rounded text-red-500 text-sm font-mono text-center">
          {{ errorMessage }}
        </div>
        
        <div *ngIf="successMessage" class="mb-6 p-3 bg-green-500/10 border border-green-500/50 rounded text-green-500 text-sm font-mono text-center">
          {{ successMessage }}
        </div>

        <!-- Step 1: Request OTP -->
        <form *ngIf="step === 'REQUEST_OTP'" (ngSubmit)="requestOtp()" class="space-y-5">
          <div>
            <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Registered Email</label>
            <input type="email" name="email" [(ngModel)]="email" required
              class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-sm"
              placeholder="dev@codesync.local">
          </div>

          <button type="submit" [disabled]="isLoading"
            class="w-full py-3 px-4 rounded text-sm font-bold text-black bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-surface focus:ring-primary transition-all uppercase tracking-widest shadow-[0_0_15px_rgba(0,240,255,0.3)] mt-2 disabled:opacity-50 disabled:cursor-not-allowed">
            {{ isLoading ? 'Processing...' : 'Send OTP' }}
          </button>
        </form>

        <!-- Step 2: Verify OTP -->
        <form *ngIf="step === 'VERIFY_OTP'" (ngSubmit)="verifyOtpStep()" class="space-y-5">
          <p class="text-sm text-slate-400 mb-4 font-mono">We've sent a 6-digit code to <span class="text-primary">{{ email }}</span>.</p>
          
          <div>
            <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Enter OTP</label>
            <input type="text" name="otp" [(ngModel)]="otp" required maxlength="6"
              class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-center tracking-[0.5em] text-lg"
              placeholder="000000">
          </div>

          <button type="submit" 
            class="w-full py-3 px-4 rounded text-sm font-bold text-black bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-surface focus:ring-primary transition-all uppercase tracking-widest shadow-[0_0_15px_rgba(0,240,255,0.3)] mt-2">
            Verify Code
          </button>
          
          <div class="mt-4 text-center">
            <button type="button" (click)="step = 'REQUEST_OTP'" class="text-xs text-slate-500 hover:text-white font-mono transition-colors">
              Wrong email? Go back.
            </button>
          </div>
        </form>

        <!-- Step 3: Reset Password -->
        <form *ngIf="step === 'RESET_PASSWORD'" (ngSubmit)="resetPassword()" class="space-y-5">
          <div>
            <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">New Password</label>
            <input type="password" name="newPassword" [(ngModel)]="newPassword" required minlength="6"
              class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-sm tracking-widest"
              placeholder="••••••••••">
          </div>
          
          <div>
            <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Confirm Password</label>
            <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" required minlength="6"
              class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-sm tracking-widest"
              placeholder="••••••••••">
          </div>

          <button type="submit" [disabled]="isLoading"
            class="w-full py-3 px-4 rounded text-sm font-bold text-black bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-surface focus:ring-primary transition-all uppercase tracking-widest shadow-[0_0_15px_rgba(0,240,255,0.3)] mt-2 disabled:opacity-50 disabled:cursor-not-allowed">
            {{ isLoading ? 'Saving...' : 'Set Password' }}
          </button>
        </form>
        
        <div class="mt-6 flex items-center justify-center">
          <a routerLink="/auth/login" class="text-xs font-mono tracking-widest text-slate-400 hover:text-white transition-colors uppercase flex items-center space-x-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            <span>Back to Login</span>
          </a>
        </div>

      </div>
    </div>
  </div>
</div>
