<div class="min-h-full flex items-center justify-center p-8 bg-background text-slate-300">
  <div class="w-full max-w-md">
    <div class="bg-surface border border-slate-800 rounded-2xl p-8 shadow-2xl">
      <div class="mb-8">
        <h2 class="text-2xl font-bold text-white mb-2">Complete Your Profile</h2>
        <p class="text-slate-500 font-mono text-xs">{{ provider }} OAuth Setup</p>
      </div>

      <!-- Email Display (Read-only) -->
      <div class="mb-6">
        <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Email</label>
        <input type="email" disabled [value]="email"
          class="block w-full px-4 py-2.5 bg-slate-900/50 border border-slate-700 rounded text-slate-300 cursor-not-allowed font-mono text-sm">
        <p class="text-[10px] text-slate-600 mt-1">Connected with {{ provider }}</p>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="mb-6 p-3 bg-red-500/10 border border-red-500/50 rounded text-red-500 text-sm font-mono text-center">
        {{ errorMessage }}
      </div>

      <!-- Success Message -->
      <div *ngIf="successMessage" class="mb-6 p-3 bg-green-500/10 border border-green-500/50 rounded text-green-500 text-sm font-mono text-center">
        {{ successMessage }}
      </div>

      <form (ngSubmit)="completeRegistration()" class="space-y-5">
        <!-- Username -->
        <div>
          <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Username *</label>
          <input type="text" [(ngModel)]="username" name="username" required
            class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-sm"
            placeholder="your_username"
            [disabled]="isLoading">
          <p class="text-[10px] text-slate-600 mt-1">3-50 characters, alphanumeric and underscore</p>
        </div>

        <!-- Full Name -->
        <div>
          <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Full Name *</label>
          <input type="text" [(ngModel)]="fullName" name="fullName" required
            class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-sm"
            placeholder="Your Full Name"
            [disabled]="isLoading">
        </div>

        <!-- Avatar URL -->
        <div>
          <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Avatar URL (Optional)</label>
          <input type="url" [(ngModel)]="avatarUrl" name="avatarUrl"
            class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-sm"
            placeholder="https://example.com/avatar.jpg"
            [disabled]="isLoading">
          <p class="text-[10px] text-slate-600 mt-1">Link to your profile picture</p>
        </div>

        <!-- Bio -->
        <div>
          <label class="block text-[10px] font-mono tracking-widest text-slate-400 mb-2 uppercase">Bio (Optional)</label>
          <textarea [(ngModel)]="bio" name="bio" rows="3"
            class="block w-full px-4 py-2.5 bg-background border border-slate-800 rounded text-slate-200 placeholder-slate-600 focus:outline-none focus:border-primary transition-colors font-mono text-sm resize-none"
            placeholder="Tell us about yourself..."
            [disabled]="isLoading"></textarea>
          <p class="text-[10px] text-slate-600 mt-1">Max 1000 characters</p>
        </div>

        <!-- Submit Button -->
        <button type="submit" [disabled]="isLoading"
          class="w-full py-3 px-4 rounded text-sm font-bold text-black bg-primary hover:bg-primary/90 disabled:bg-primary/50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-surface focus:ring-primary transition-all uppercase tracking-widest shadow-[0_0_15px_rgba(0,240,255,0.3)] mt-6">
          {{ isLoading ? 'Creating Account...' : 'Complete Registration' }}
        </button>
      </form>

      <p class="mt-6 text-center text-xs text-slate-400 font-mono">
        <a href="/auth/login" class="font-bold text-primary hover:text-white transition-colors">Back to Login</a>
      </p>
    </div>
  </div>
</div>
